
<!DOCTYPE html>
<html>
<head>
    <title>Car Animation</title>

    <style>
        #img {
            position: relative;
            left: 0px;
            width: 150px;
        }
    </style>
</head>
<body>

    <h1>Car Animation</h1>

    <img id="img"
         src="https://www.pngall.com/wp-content/uploads/2016/06/Car-PNG-Image.png"
         width="150">

    <br><br>

    <button onclick="moveRight()">Move</button>
    <button onclick="stop()">Stop</button>

    <script>
        var imgObj;
        var animate;

        function init() {
            imgObj = document.getElementById("img");
            imgObj.style.left = "0px";
        }

        function moveRight() {
            clearTimeout(animate);

            function frame() {
                imgObj.style.left =
                    parseInt(imgObj.style.left) + 1 + "px";

                animate = setTimeout(frame, 10);
            }

            frame();
        }

        function stop() {
            clearTimeout(animate);
        }

        window.onload = init;
    </script>

</body>
</html>
